<?xml version="1.0" encoding="utf-8"?>
<!--
  Favicon kaynagi. Site logosundan ayri bir dosya olmasinin sebebi boyut:
  logo ada simgesi, "Cypilan" yazisi ve slogandan olusuyor ve arama
  sonuclarinda gosterildigi 16 pikselde okunaksiz bir lekeye donusuyordu.
  Adanin kendisi de o boyutta kurtarilamiyor - genis, ince ve duzensiz bir
  sekil. Bu yuzden favicon icin tek harflik bir isaret kullaniliyor; sitenin
  ustundeki logo degismiyor.

  Mavi #3C81AB, logodaki "Cypilan" yazisindan ornekle alindi.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#3C81AB"/>
  <path d="M 359.4 169.2 A 135 135 0 1 0 359.4 342.8"
        fill="none" stroke="#FFFFFF" stroke-width="78" stroke-linecap="round"/>
</svg>
